<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI产品经理 · 个人简历</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #f2f3f8;
    --surface: #ffffff;
    --ink: #14161f;
    --ink-soft: #5a5f72;
    --ink-faint: #8b8fa3;
    --line: #e2e4ee;
    --line-strong: #ccd0e2;

    --blue: #2f5fee;
    --blue-bg: #e8edfd;
    --teal: #0ea884;
    --teal-bg: #e1f6ee;
    --coral: #ff5a36;
    --coral-bg: #ffe7df;

    --side-bg: #12172c;
    --side-text: #f4f5ff;
    --side-text-soft: #9aa1c4;
    --side-line: rgba(255,255,255,.09);

    --font-display: 'Fraunces', 'Songti SC', serif;
    --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;

    --radius: 12px;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3{ font-family: var(--font-display); font-weight: 600; margin: 0; }
  a{ color: inherit; }
  ::selection{ background: var(--coral-bg); }

  a:focus-visible, button:focus-visible{
    outline: 2px solid var(--blue);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  /* ========== 顶部导航栏 ========== */
  .topbar{
    position: sticky; top:0; z-index: 20;
    background: var(--side-bg);
    display:flex; align-items:center; justify-content:space-between;
    gap: 24px;
    padding: 14px 32px;
  }
  .brand{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .brand-avatar{
    width: 34px; height: 34px; border-radius: 50%;
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, var(--blue), var(--coral));
    flex-shrink:0;
  }
  .brand-avatar img{ width:100%; height:100%; object-fit:cover; display:none; }
  .brand-avatar .avatar-placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-weight:700; font-size:14px; color:#fff;
  }
  .brand-name{ color: var(--side-text); font-weight:600; font-size:15px; }

  .topnav{ list-style:none; display:flex; gap:4px; margin:0; padding:0; overflow-x:auto; }
  .topnav li{ flex-shrink:0; }
  .topnav button{
    all:unset; cursor:pointer; display:flex; align-items:center; gap:6px;
    padding: 8px 14px; font-size:13.5px; font-weight:500;
    color: var(--side-text-soft); border-radius: 999px;
    white-space:nowrap;
    transition: background .15s ease, color .15s ease;
  }
  .topnav button svg{ flex-shrink:0; }
  .topnav button:hover{ background: var(--side-line); color: var(--side-text); }
  .topnav button.active{ background: var(--nav-color, var(--blue)); color:#fff; font-weight:600; }

  /* ========== 内容区 ========== */
  .content{ max-width: 940px; margin: 0 auto; padding: 48px 32px 80px; }
  .section{ display:none; animation: fadeIn .35s ease; }
  .section.active{ display:block; }
  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .sec-title{ display:flex; align-items:center; gap:12px; font-size: 24px; margin-bottom: 28px; }
  .sec-title::before{
    content:''; display:block; width:5px; height: 24px; border-radius: 3px;
    background: var(--bar-color, var(--blue));
  }

  /* ---- 个人主页（首页）---- */
  .hero-grid{
    display:flex; align-items:center; justify-content:space-between;
    gap: 40px; margin-bottom: 34px;
  }
  .hero-text{ flex:1; min-width:0; }
  .hero-greeting{ font-size: 15px; color: var(--ink-soft); margin-bottom: 6px; }
  .hero-name{ font-size: 42px; margin-bottom: 10px; }
  .hero-role{
    display:inline-block; font-size: 13.5px; font-weight:600;
    color: var(--blue); background: var(--blue-bg);
    padding: 5px 14px; border-radius: 999px; margin-bottom: 16px;
  }
  .hero-tagline{ font-size: 15.5px; color: var(--ink-soft); max-width: 58ch; margin: 0 0 20px; }

  .hero-avatar{
    width: 128px; height: 128px; border-radius: 50%; flex-shrink:0;
    position: relative; overflow:hidden;
    background: linear-gradient(135deg, var(--blue), var(--coral));
    border: 4px solid var(--surface);
    box-shadow: 0 0 0 1px var(--line);
  }
  .hero-avatar img{ width:100%; height:100%; object-fit:cover; display:none; }
  .hero-avatar .avatar-placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-weight:700; font-size:44px; color:#fff;
  }

  .contact-list{ list-style:none; margin:0 0 20px; padding:0; display:flex; flex-wrap:wrap; gap: 6px 20px; }
  .contact-list li{ display:flex; align-items:center; gap:7px; font-size: 13.5px; color: var(--ink-soft); }
  .contact-list svg{ flex-shrink:0; opacity:.75; }

  .pill-row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom: 8px; }
  .pill{ font-size: 13px; font-weight:600; padding: 7px 16px; border-radius: 999px; color:#fff; }
  .pill.blue{ background: var(--blue); }
  .pill.teal{ background: var(--teal); }
  .pill.coral{ background: var(--coral); }

  .stat-row{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 36px; }
  .stat-card{
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 20px;
  }
  .stat-value{ font-family: var(--font-display); font-size: 28px; font-weight:700; color: var(--coral); margin-bottom: 4px; }
  .stat-label{ font-size: 12.5px; color: var(--ink-soft); }

  .summary-card{
    background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--coral);
    border-radius: var(--radius); padding: 24px; font-size: 14.5px; color: var(--ink); max-width: 74ch;
  }

  mark{ background:none; color: var(--coral); font-weight: 700; padding: 0; }
  strong{ font-weight: 600; }

  /* ---- 作品展示 ---- */
  .portfolio-head{ margin-bottom: 30px; }
  .portfolio-eyebrow{ font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--teal); margin-bottom: 10px; }
  .portfolio-title{ font-size: 30px; margin-bottom: 12px; }
  .portfolio-rule{ width: 44px; height: 3px; background: var(--teal); border-radius: 2px; }

  .portfolio-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .portfolio-card{
    display:block; text-decoration:none; color: inherit;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; transition: border-color .2s ease, transform .2s ease;
  }
  .portfolio-card:hover{ border-color: var(--line-strong); transform: translateY(-3px); }

  .portfolio-cover{ position: relative; height: 176px; overflow: hidden; background: var(--blue-bg); }
  .portfolio-cover img{ width:100%; height:100%; object-fit: cover; display:block; transition: transform .3s ease; }
  .portfolio-card:hover .portfolio-cover img{ transform: scale(1.05); }

  .portfolio-fallback{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--blue), var(--teal));
    color:#fff; font-weight:700; font-size:14.5px; text-align:center; padding: 20px;
  }

  .portfolio-tag{ position:absolute; top:12px; left:12px; font-size: 11.5px; font-weight:700; color:#fff; padding: 4px 10px; border-radius: 999px; }
  .portfolio-tag.live{ background: var(--teal); }
  .portfolio-tag.solo{ background: var(--blue); }

  .portfolio-overlay{
    position:absolute; inset:0; background: rgba(18,23,44,.72);
    display:flex; align-items:center; justify-content:center; gap:6px;
    color:#fff; font-size:13.5px; font-weight:600;
    opacity:0; transition: opacity .2s ease;
  }
  .portfolio-card:hover .portfolio-overlay{ opacity:1; }

  .portfolio-body{ padding: 18px 20px 20px; }
  .portfolio-stack{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom: 10px; }
  .portfolio-stack span{ font-size: 11.5px; color: var(--ink-soft); background: var(--bg); border-radius: 6px; padding: 2px 8px; }
  .portfolio-name{ font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .portfolio-blurb{ font-size: 13px; color: var(--ink-soft); }

  /* ---- 工作经历 ---- */
  .job{ padding: 22px 0; border-bottom: 1px solid var(--line); }
  .job:first-child{ padding-top: 0; }
  .job:last-child{ border-bottom: none; }
  .job-head{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 10px; }
  .job-company{ font-size: 17px; font-weight: 600; }
  .job-meta{ font-size: 13px; color: var(--ink-soft); font-weight:600; }
  .job-body{ font-size: 14.5px; color: var(--ink); max-width: 72ch; }
  .job-body p{ margin: 0 0 8px; }
  .job-body p:last-child{ margin-bottom: 0; }

  /* ---- 项目经历 ---- */
  .project-card{ background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; margin-bottom: 22px; }
  .project-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 16px; }
  .project-title{ font-size: 18px; font-weight: 600; }
  .project-tag{ font-size: 12px; font-weight:700; color:#fff; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
  .project-tag.live{ background: var(--teal); }
  .project-tag.solo{ background: var(--blue); }

  .project-row{ margin-bottom: 14px; }
  .project-row:last-of-type{ margin-bottom: 0; }
  .project-label{ font-size: 12.5px; color: var(--ink-faint); font-weight:600; margin-bottom: 4px; }
  .project-text{ font-size: 14px; color: var(--ink); }

  /* ---- 技能特长 ---- */
  .skill-groups{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .skill-group h3{ font-size: 14px; font-family: var(--font-body); font-weight: 700; color: var(--ink-soft); margin-bottom: 14px; }
  .skill-tags{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .skill-tags li{ font-size: 13.5px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; line-height: 1.5; }

  /* ---- 教育背景 ---- */
  .edu-card{ background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: var(--radius); padding: 22px 24px; max-width: 60ch; }
  .edu-school{ font-size: 17px; font-weight: 600; margin-bottom: 2px; }
  .edu-meta{ font-size: 13.5px; color: var(--ink-soft); }

  /* ========== 移动端适配 ========== */
  @media (max-width: 820px){
    .topbar{ padding: 12px 16px; flex-wrap: wrap; }
    .topnav{ width:100%; padding-top: 4px; }
    .content{ padding: 32px 18px 60px; }

    .hero-grid{ flex-direction: column-reverse; align-items:flex-start; gap: 20px; }
    .hero-avatar{ width: 88px; height: 88px; }
    .hero-avatar .avatar-placeholder{ font-size: 30px; }
    .hero-name{ font-size: 30px; }
    .stat-row{ grid-template-columns: 1fr 1fr; }
    .skill-groups{ grid-template-columns: 1fr; gap: 22px; }
    .portfolio-grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<header class="topbar">
  <div class="brand">
    <div class="brand-avatar">
      <img id="avatarImgSmall" alt="头像">
      <div class="avatar-placeholder" id="avatarPlaceholderSmall">姓</div>
    </div>

  </div>
  <ul class="topnav" id="navList"></ul>
</header>

<!-- ===== 内容区 ===== -->
<main class="content">

  <section class="section" id="sec-home">

      <div class="hero-text">

    <div class="stat-row" id="statRow"></div>

    <h2 class="sec-title" style="--bar-color:var(--blue)">个人优势</h2>

  </section>

  <section class="section" id="sec-projects">
    <h2 class="sec-title" style="--bar-color:var(--coral)">项目经历</h2>
    <div id="projectList"></div>
  </section>

  <section class="section" id="sec-portfolio">
    <div class="portfolio-head">
      <div class="portfolio-eyebrow">PORTFOLIO</div>
      <h2 class="portfolio-title">作品展示</h2>

  </section>

  <section class="section" id="sec-work">
    <h2 class="sec-title" style="--bar-color:var(--blue)">工作经历</h2>
    <div id="jobList"></div>
  </section>

  <section class="section" id="sec-skills">
    <h2 class="sec-title" style="--bar-color:var(--coral)">技能特长</h2>
    <div class="skill-groups" id="skillGroups"></div>
  </section>

  <section class="section" id="sec-edu">
    <h2 class="sec-title" style="--bar-color:var(--teal)">教育背景</h2>
    <div id="eduCard"></div>
  </section>

</main>

/* ============================================================
   头像加载：按 avatar.png → avatar.jpg → avatar.jpeg 顺序探测，
   与当前 HTML 文件放在同一目录下即可自动识别；页面里顶部小头像
   与个人主页大头像各自独立探测，三种格式都不存在时保留渐变占位样式。
   ============================================================ */
function loadAvatarInto(imgId, placeholderId){
  const exts = ['png', 'jpg', 'jpeg'];
  const img = document.getElementById(imgId);
  const placeholder = document.getElementById(placeholderId);
  let i = 0;
  function tryNext(){
    if (i >= exts.length){
      img.style.display = 'none';
      placeholder.style.display = 'flex';
      return;
    }
    const candidate = 'avatar.' + exts[i];
    img.onload = function(){ img.style.display = 'block'; placeholder.style.display = 'none'; };
    img.onerror = function(){ i++; tryNext(); };
    img.src = candidate;
  }
  tryNext();
}
loadAvatarInto('avatarImgSmall', 'avatarPlaceholderSmall');
loadAvatarInto('avatarImgLarge', 'avatarPlaceholderLarge');

  const nav = document.getElementById('navList');
  nav.innerHTML = NAV_ITEMS.map((item, idx) =>

  ).join('');

  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => switchSection(btn.dataset.target, btn));
  });
}

function switchSection(targetId, btn){
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(targetId).classList.add('active');
  document.querySelectorAll('.topnav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
