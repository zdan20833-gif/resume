<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周应丹 · AI 产品经理简历</title>
<meta name="description" content="周应丹 - AI 产品经理，4 年经验，专注 RAG / Agent 工作流与 Prompt 工程。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f2f2f2;
    --paper: #ffffff;
    --primary: #2b3a67;          /* 深藏青主色 */
    --primary-bg: #eef0f6;       /* 标题浅色底纹 */
    --text: #333333;
    --text-secondary: #555555;
    --text-muted: #888888;
    --line: #d9dce4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 13.5px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* 打印 / 导出 PDF 按钮 */
  .print-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 4px 12px rgba(43,58,103,.25);
    transition: background .15s ease, transform .15s ease;
  }
  .print-btn:hover { background: #1f2b4d; transform: translateY(-1px); }

  /* 纸张容器 */
  .page {
    max-width: 794px;
    margin: 40px auto;
    padding: 56px 60px;
    background: var(--paper);
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 12px 40px rgba(0,0,0,.08);
  }

  /* ============ 个人信息头部（位置不变） ============ */
  .profile-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    margin-bottom: 34px;
    padding-bottom: 22px;
    border-bottom: 2px solid var(--primary);
  }
  .profile-info { flex: 1; min-width: 0; }
  .profile-name {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1.2;
    color: var(--primary);
  }
  .profile-intent {
    margin-top: 8px;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .profile-contact {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .photo-placeholder {
    flex: none;
    width: 96px;
    height: 128px;
    border-radius: 4px;
    overflow: hidden;
    border: 2px solid var(--primary);
  }
  .photo-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ============ 章节（标题样式 + 底纹，位置不变） ============ */
  .section { margin-bottom: 30px; }

  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 700;
    color: var(--primary);
    background: var(--primary-bg);
    padding: 8px 14px;
    margin-bottom: 16px;
    border-left: 5px solid var(--primary);
    border-radius: 2px;
  }
  .section-title::before {
    content: "";
    flex: none;
    width: 4px;
    height: 16px;
    background: var(--primary);
    border-radius: 1px;
  }

  /* ============ 个人优势 ============ */
  .summary { color: var(--text-secondary); }

  /* ============ 项目经历 ============ */
  .project { margin-bottom: 22px; }
  .project:last-child { margin-bottom: 0; }

  .project-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }

  .project p {
    margin-bottom: 7px;
    color: var(--text-secondary);
  }
  .project p:last-child { margin-bottom: 0; }

  .field-label {
    font-weight: 700;
    color: var(--primary);
  }

  strong { font-weight: 600; color: var(--text); }

  /* ============ 工作经历 ============ */
  .job { margin-bottom: 20px; }
  .job:last-child { margin-bottom: 0; }

  .job-head {
    display: flex;
    gap: 16px;
    margin-bottom: 8px;
  }
  .job-company { flex: 1.6; font-size: 15px; font-weight: 700; color: var(--text); }
  .job-period { flex: 1; font-size: 13px; color: var(--text-muted); }
  .job-role { flex: 1; text-align: right; font-size: 13px; font-weight: 600; color: var(--primary); }
  .job p { color: var(--text-secondary); margin-bottom: 6px; }
  .job p:last-child { margin-bottom: 0; }

  /* ============ 技能总结 ============ */
  .skill-row { margin-bottom: 9px; color: var(--text-secondary); }
  .skill-row:last-child { margin-bottom: 0; }
  .skill-row .skill-name { font-weight: 700; color: var(--primary); }

  /* ============ 教育背景 ============ */
  .edu-head { display: flex; gap: 16px; }
  .edu-school { flex: 1; font-weight: 700; color: var(--text); }
  .edu-period { flex: 1; color: var(--text-muted); }
  .edu-major { flex: 1; color: var(--text-secondary); }
  .edu-degree { flex: 1; text-align: right; color: var(--text-secondary); }

  /* ============ 打印样式 ============ */
  @media print {
    body { background: #fff; font-size: 12.5px; }
    .print-btn { display: none !important; }
    .page {
      max-width: none;
      margin: 0;
      padding: 0;
      box-shadow: none;
    }
    a { color: inherit; text-decoration: none; }
    .section { margin-bottom: 20px; }
    .project { margin-bottom: 16px; }
    .project p { margin-bottom: 5px; }
    .profile-header { margin-bottom: 24px; }
  }

  @page {
    size: A4;
    margin: 17mm 16mm;
  }

  /* ============ 小屏响应式 ============ */
  @media (max-width: 600px) {
    .page { margin: 0; padding: 28px 22px; box-shadow: none; }
    .profile-name { font-size: 24px; }
    .photo-placeholder { width: 72px; height: 96px; }
    .job-head { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<button class="print-btn" onclick="window.print()">打印 / 导出 PDF</button>

<div class="page" id="page"></div>

<script>

/* ==========================================================================
   渲染逻辑 —— 一般不用改。
   ========================================================================== */

function md(text) {
  return text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function render() {
  const p = RESUME;

  /* 个人信息头部 */
  const header = `
    <header class="profile-header">
      <div class="profile-info">
        <h1 class="profile-name">${p.name}</h1>
        <p class="profile-intent">求职意向：${p.intent}</p>
        <p class="profile-contact">☎️ ${p.phone}　·　📮 ${p.email}　·　现居地：${p.location}</p>
      </div>
      <div class="photo-placeholder"><img src="${p.photo}" alt="证件照"></div>
    </header>`;

  /* 个人优势 */
  const summary = `
    <section class="section">
      <h2 class="section-title">个人优势</h2>
      <p class="summary">${md(p.summary)}</p>
    </section>`;

  /* 项目经历 */
  const projects = `
    <section class="section">
      <h2 class="section-title">项目经历</h2>
      ${p.projects.map(pr => `
        <article class="project">
          <h3 class="project-title">${pr.title}</h3>
          ${pr.rows.map(r => `<p><span class="field-label">${r.label}：</span>${md(r.text)}</p>`).join('')}
        </article>`).join('')}
    </section>`;

  /* 工作经历 */
  const jobs = `
    <section class="section">
      <h2 class="section-title">工作经历</h2>
      ${p.jobs.map(j => `
        <article class="job">
          <div class="job-head">
            <span class="job-company">${j.company}</span>
            <span class="job-period">${j.period}</span>
            <span class="job-role">${j.role}</span>
          </div>
          ${j.desc.map(d => `<p>${md(d)}</p>`).join('')}
        </article>`).join('')}
    </section>`;

  /* 技能总结 */
  const skills = `
    <section class="section">
      <h2 class="section-title">技能总结</h2>
      ${p.skills.map(s => `<p class="skill-row"><span class="skill-name">${s.name}</span>　${md(s.text)}</p>`).join('')}
    </section>`;

  /* 教育背景 */
  const education = `
    <section class="section">
      <h2 class="section-title">教育背景</h2>
      <div class="edu-head">
        <span class="edu-school">${p.education.school}</span>
        <span class="edu-period">${p.education.period}</span>
        <span class="edu-major">${p.education.major}</span>
        <span class="edu-degree">${p.education.degree}</span>
      </div>
    </section>`;

  document.getElementById('page').innerHTML = header + summary + projects + jobs + skills + education;

  document.title = p.name + " · AI 产品经理简历";

  const ld = {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": p.name,
    "jobTitle": "AI 产品经理",
    "telephone": p.phone,
    "email": p.email,
    "knowsAbout": ["RAG", "Agent 工作流", "LLM 应用开发", "Prompt 工程", "Function Calling"]
  };
  const ldScript = document.createElement('script');
  ldScript.type = 'application/ld+json';
  ldScript.textContent = JSON.stringify(ld);
  document.head.appendChild(ldScript);
}

render();
</script>

</body>
